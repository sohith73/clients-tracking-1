name: Discord Onboarding Cron

# Daily Discord onboarding sweep. The inbound HTTPS request also wakes the
# backend if the host suspended it.
# Endpoint: POST /api/internal/run-discord-onboarding (needs x-cron-secret).
# Add a repo secret named DISCORD_CRON_SECRET, matching the backend env var.
#
# The backend runs its own cron at 8:00 and 8:30 AM IST (node-cron in index.js). This
# workflow is only a wake-up net for a suspended host: a suspended instance cannot run its
# own cron, but this inbound request wakes it and runs the sweep. It fires 5 minutes after
# each backend run. The sweep is idempotent per client, need and IST day, and every trigger
# shares one runner on the backend, so these runs never overlap or double-post: when the
# backend already did the work they post nothing, and a busy backend answers 409, which
# counts as success here.

on:
  schedule:
    # GitHub Actions cron is UTC. 08:05 IST = 02:35 UTC, 08:35 IST = 03:05 UTC.
    - cron: "35 2 * * *"
    - cron: "5 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: discord-onboarding-sweep
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hit Discord onboarding sweep endpoint
        env:
          BASE_URL: https://clients-tracking-backend-580t.onrender.com
          CRON_SECRET: ${{ secrets.DISCORD_CRON_SECRET }}
          RUN_KIND: ${{ github.event.schedule == '5 3 * * *' && 'second' || 'first' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "DISCORD_CRON_SECRET repo secret is empty"; exit 1
          fi
          URL="$BASE_URL/api/internal/run-discord-onboarding"
          echo "Run kind: $RUN_KIND. Triggering: $URL"
          # Retry up to 5 times, the first hit may just be waking a cold instance.
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sS -o resp.json -w "%{http_code}" -m 120 \
              -X POST "$URL" \
              -H "x-cron-secret: $CRON_SECRET") || CODE=000
            echo "Attempt $attempt -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Sweep summary:"; cat resp.json; echo
              FAILED=$(jq -r '.failed // 0' resp.json)
              if [ "$FAILED" != "0" ]; then
                echo "::error::Sweep finished with $FAILED failed post(s). The next run retries them."
                exit 1
              fi
              exit 0
            fi
            if [ "$CODE" = "409" ]; then
              echo "Another sweep is already running, nothing to do."; exit 0
            fi
            # 401 and 503 will not fix themselves by retrying fast.
            if [ "$CODE" = "401" ] || [ "$CODE" = "503" ]; then
              echo "Not retrying (HTTP $CODE)"; cat resp.json || true; echo; exit 1
            fi
            echo "Not ready (HTTP $CODE), waiting 20s..."; sleep 20
          done
          echo "Sweep failed after retries. Last response:"; cat resp.json || true
          exit 1
